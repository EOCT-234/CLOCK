<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Arc Clock Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #0b0c0e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
        }

        /* Escenario donde se dibuja el reloj */
        .clock-stage {
            position: absolute;
            left: 5vw;
            top: 50%;
            transform: translateY(-50%);
            width: 600px;
            height: 600px;
        }

        /* 1. La hora destacada */
        .hour-display {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 8rem;
            font-weight: 700;
            color: #ffffff;
            z-index: 10;
            line-height: 1;
            letter-spacing: -3px;
        }

        /* 2. El óvalo alargado que enmarca minutos (izq) y segundos (der) */
        .oval-pill {
            position: absolute;
            left: 175px;
            top: 50%;
            transform: translateY(-50%);
            width: 140px;
            height: 52px;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 26px;
            z-index: 8;
            pointer-events: none;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
        }

        /* 3. El centro virtual alrededor del cual giran ambos círculos */
        .wheel-center {
            position: absolute;
            left: 60px; /* Alineado con el centro del óvalo a la derecha */
            top: 50%;
            width: 0;
            height: 0;
        }

        /* Anillos giratorios */
        .dial-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            transition: transform 0.3s cubic-bezier(0.1, 0, 0.1, 1);
        }

        /* CÍRCULO INTERIOR: Números de minutos */
        .minute-item {
            position: absolute;
            font-size: 1.5rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            width: 50px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            margin-left: -25px;
            margin-top: -20px;
        }

        /* CÍRCULO EXTERIOR: Ticks/marcas de segundos */
        .tick-item {
            position: absolute;
            width: 2px;
            height: 14px;
            background-color: rgba(255, 255, 255, 0.25);
            margin-left: -1px;
            margin-top: -7px;
        }

        .tick-item.major {
            width: 3px;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.75);
            margin-left: -1.5px;
            margin-top: -10px;
        }

        /* 4. Fecha y día en la esquina inferior */
        .date-display {
            position: absolute;
            right: 80px;
            bottom: 80px;
            text-align: right;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .date-display .full-date {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .date-display .day-name {
            font-size: 1.4rem;
            color: #ffffff;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* Botones superiores */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            opacity: 0.3;
            transition: opacity 0.3s ease;
            z-index: 20;
        }

        .controls:hover {
            opacity: 1;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Controles -->
        <div class="controls">
            <button class="btn" onclick="toggleFormat()">Formato: <span id="format-label">24H</span></button>
            <button class="btn" onclick="toggleFullscreen()">Pantalla Completa</button>
        </div>

        <div class="clock-stage">
            <!-- Hora fija a la izquierda -->
            <div class="hour-display" id="hour">18</div>

            <!-- Óvalo selector -->
            <div class="oval-pill"></div>

            <!-- Eje central desde donde se trazan los dos círculos -->
            <div class="wheel-center">
                <div class="dial-ring" id="minutes-ring"></div>
                <div class="dial-ring" id="seconds-ring"></div>
            </div>
        </div>

        <!-- Fecha inferior derecha -->
        <div class="date-display">
            <div class="full-date" id="date-str">13 AUG 2026</div>
            <div class="day-name" id="day-str">THURSDAY</div>
        </div>
    </div>

    <script>
        let is24Hour = true;
        const R_MINUTES = 160; // Radio del círculo interior (Números de minutos)
        const R_SECONDS = 220; // Radio del círculo exterior (Ticks de segundos)

        function buildDials() {
            const minutesRing = document.getElementById('minutes-ring');
            const secondsRing = document.getElementById('seconds-ring');

            // 1. Generar Círculo Interior: Números cada 5 minutos (00, 05, 10... 55)
            for (let i = 0; i < 60; i += 5) {
                const angleDeg = i * 6; // 360° / 60 min = 6° por minuto
                const angleRad = angleDeg * (Math.PI / 180);

                const item = document.createElement('div');
                item.className = 'minute-item';
                item.innerText = i.toString().padStart(2, '0');

                const x = R_MINUTES * Math.cos(angleRad);
                const y = R_MINUTES * Math.sin(angleRad);

                item.style.left = `${x}px`;
                item.style.top = `${y}px`;
                // Rotar cada número para que apunte radialmente hacia afuera
                item.style.transform = `rotate(${angleDeg}deg)`;

                minutesRing.appendChild(item);
            }

            // 2. Generar Círculo Exterior: 60 marcas/ticks de segundos
            for (let i = 0; i < 60; i++) {
                const angleDeg = i * 6;
                const angleRad = angleDeg * (Math.PI / 180);

                const tick = document.createElement('div');
                tick.className = `tick-item ${i % 5 === 0 ? 'major' : ''}`;

                const x = R_SECONDS * Math.cos(angleRad);
                const y = R_SECONDS * Math.sin(angleRad);

                tick.style.left = `${x}px`;
                tick.style.top = `${y}px`;
                tick.style.transform = `rotate(${angleDeg + 90}deg)`;

                secondsRing.appendChild(tick);
            }
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            if (!is24Hour) {
                hours = hours % 12 || 12;
            }

            // Actualizar número de Hora
            document.getElementById('hour').innerText = hours.toString().padStart(2, '0');

            // Rotar el círculo de minutos para que el minuto actual quede horizontal a las 0° (dentro de la parte izquierda del óvalo)
            const minAngle = -(minutes * 6 + (seconds / 60) * 6);
            document.getElementById('minutes-ring').style.transform = `rotate(${minAngle}deg)`;

            // Rotar el círculo exterior de segundos
            const secAngle = -(seconds * 6);
            document.getElementById('seconds-ring').style.transform = `rotate(${secAngle}deg)`;

            // Fecha
            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            const days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];

            document.getElementById('date-str').innerText = `${now.getDate().toString().padStart(2, '0')} ${months[now.getMonth()]} ${now.getFullYear()}`;
            document.getElementById('day-str').innerText = days[now.getDay()];
        }

        function toggleFormat() {
            is24Hour = !is24Hour;
            document.getElementById('format-label').innerText = is24Hour ? '24H' : '12H';
            updateClock();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        buildDials();
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
