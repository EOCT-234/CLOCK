<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Arc Clock Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        /* Posicionamiento del semicírculo a la izquierda */
        .clock-wrapper {
            position: absolute;
            left: -120px;
            top: 50%;
            transform: translateY(-50%);
            width: 700px;
            height: 700px;
        }

        .dial {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Ticks y marcas de segundos */
        .tick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.35);
            transform-origin: 0 0;
        }

        .tick.major {
            width: 3px;
            height: 18px;
            background-color: rgba(255, 255, 255, 0.9);
        }

        /* Números del minuto */
        .minute-num {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 1.5rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            transform-origin: 0 0;
            text-anchor: middle;
        }

        /* Píldora indicadora */
        .pill-indicator {
            position: absolute;
            left: 310px;
            top: 50%;
            transform: translateY(-50%);
            width: 110px;
            height: 60px;
            border: 2px solid #ffffff;
            border-radius: 35px;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* Hora destacada */
        .hour-display {
            position: absolute;
            left: 70px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 8.5rem;
            font-weight: 700;
            color: #ffffff;
            z-index: 5;
            letter-spacing: -4px;
        }

        /* Fecha y día */
        .date-display {
            position: absolute;
            right: 80px;
            bottom: 80px;
            text-align: right;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .date-display .full-date {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .date-display .day-name {
            font-size: 1.4rem;
            color: #ffffff;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* Controles de usuario */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            opacity: 0.3;
            transition: opacity 0.3s ease;
            z-index: 20;
        }

        .controls:hover {
            opacity: 1;
        }

        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Botones de control superiores -->
        <div class="controls">
            <button class="btn" onclick="toggleFormat()">Formato: <span id="format-label">24H</span></button>
            <button class="btn" onclick="toggleFullscreen()">Pantalla Completa</button>
        </div>

        <!-- Hora principal -->
        <div class="hour-display" id="hour">12</div>

        <!-- Semicírculo del reloj -->
        <div class="clock-wrapper">
            <div class="dial" id="ticks-dial"></div>
            <div class="dial" id="minutes-dial"></div>
        </div>

        <!-- Píldora del minuto actual -->
        <div class="pill-indicator"></div>

        <!-- Fecha en la esquina inferior derecha -->
        <div class="date-display">
            <div class="full-date" id="date-str">08 NOV 2026</div>
            <div class="day-name" id="day-str">SUNDAY</div>
        </div>
    </div>

    <script>
        let is24Hour = true;

        function createClockDial() {
            const ticksDial = document.getElementById('ticks-dial');
            const minutesDial = document.getElementById('minutes-dial');
            const radiusTicks = 320;
            const radiusNum = 270;
            const center = 350;

            for (let i = 0; i < 60; i++) {
                const angle = (i * 6) * (Math.PI / 180);
                const tick = document.createElement('div');
                tick.className = `tick ${i % 5 === 0 ? 'major' : ''}`;
                
                const x = center + radiusTicks * Math.cos(angle);
                const y = center + radiusTicks * Math.sin(angle);
                
                tick.style.left = `${x}px`;
                tick.style.top = `${y}px`;
                tick.style.transform = `rotate(${i * 6 + 90}deg)`;
                ticksDial.appendChild(tick);
            }

            for (let i = 0; i < 60; i += 5) {
                const angle = (i * 6) * (Math.PI / 180);
                const num = document.createElement('div');
                num.className = 'minute-num';
                num.innerText = i.toString().padStart(2, '0');
                
                const x = center + radiusNum * Math.cos(angle) - 15;
                const y = center + radiusNum * Math.sin(angle) - 15;
                
                num.style.left = `${x}px`;
                num.style.top = `${y}px`;
                num.style.transform = `rotate(${i * 6}deg)`;
                minutesDial.appendChild(num);
            }
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            if (!is24Hour) {
                hours = hours % 12 || 12;
            }

            document.getElementById('hour').innerText = hours.toString().padStart(2, '0');

            const minuteAngle = -(minutes * 6 + (seconds / 60) * 6);
            document.getElementById('minutes-dial').style.transform = `rotate(${minuteAngle}deg)`;
            document.getElementById('ticks-dial').style.transform = `rotate(${minuteAngle}deg)`;

            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            const days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
            
            const dateString = `${now.getDate().toString().padStart(2, '0')} ${months[now.getMonth()]} ${now.getFullYear()}`;
            document.getElementById('date-str').innerText = dateString;
            document.getElementById('day-str').innerText = days[now.getDay()];
        }

        function toggleFormat() {
            is24Hour = !is24Hour;
            document.getElementById('format-label').innerText = is24Hour ? '24H' : '12H';
            updateClock();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        createClockDial();
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
