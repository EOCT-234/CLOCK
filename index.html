<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimalist Arc Clock Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- BOTÓN FLOTANTE DE FONDO DE PANTALLA --- */
        .wallpaper-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }

        .wallpaper-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- CONTENEDOR PRINCIPAL DEL RELOJ --- */
        .clock-stage {
            position: absolute;
            left: clamp(220px, 26vw, 38vw);
            top: 50%;
            transform: translateY(-50%);
            width: 950px;
            height: 700px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .clock-stage:hover {
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.3));
        }

        .hour-display {
            position: absolute;
            left: 65px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 8.5rem;
            font-weight: 700;
            color: #ffffff;
            z-index: 10;
            line-height: 1;
            letter-spacing: -3px;
        }

        .oval-pill {
            position: absolute;
            left: 235px;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
            height: 64px;
            border: 2px solid rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            z-index: 8;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px 0 45px;
        }

        .oval-pill .pill-minute {
            font-size: 3.2rem;
            font-weight: 700;
            color: #ffffff;
            z-index: 12;
            line-height: 1;
            letter-spacing: -1px;
        }

        .oval-pill .pill-second {
            font-size: 1.2rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            z-index: 12;
            letter-spacing: 0px;
        }

        .wheel-center {
            position: absolute;
            left: 110px;
            top: 50%;
            width: 0;
            height: 0;
        }

        .dial-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
        }

        .minute-tick-item {
            position: absolute;
            width: 2px;
            height: 8px;
            background-color: #ffffff;
            margin-left: -1px;
            margin-top: -4px;
        }

        .minute-tick-item.major {
            width: 3px;
            height: 16px;
            margin-left: -1.5px;
            margin-top: -8px;
        }

        .minute-tick-item.active {
            width: 4px !important;
            height: 20px !important;
            background-color: #ffffff !important;
            margin-left: -2px !important;
            margin-top: -10px !important;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
            z-index: 15;
        }

        .minute-item {
            position: absolute;
            font-size: 1.4rem;
            font-weight: 600;
            width: 50px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            margin-left: -25px;
            margin-top: -20px;
        }

        .tick-item {
            position: absolute;
            width: 2px;
            height: 10px;
            background-color: #ffffff;
            margin-left: -1px;
            margin-top: -5px;
        }

        .tick-item.major {
            width: 3px;
            height: 16px;
            margin-left: -1.5px;
            margin-top: -8px;
        }

        .tick-item.active {
            width: 3px !important;
            height: 18px !important;
            background-color: #ffffff !important;
            margin-left: -1.5px !important;
            margin-top: -9px !important;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            z-index: 15;
        }

        .second-num-item {
            position: absolute;
            font-size: 1.1rem;
            font-weight: 600;
            width: 40px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            margin-left: -20px;
            margin-top: -15px;
        }

        /* --- BLOQUE DE FECHA UBICADO A LA DERECHA INFERIOR DEL RELOJ --- */
        .date-display {
            position: absolute;
            left: 480px;
            top: 60%;
            text-align: left;
            font-family: monospace;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            transition: background-color 0.2s ease;
            z-index: 20;
        }

        .date-display:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .motivation-comment {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .date-display .full-date {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 600;
            margin-bottom: 2px;
        }

        .date-display .day-name {
            font-size: 1rem;
            color: #ffffff;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* --- ADAPTACIÓN MÓVIL / PANTALLA VERTICAL --- */
        @media screen and (max-width: 900px), screen and (orientation: portrait) {
            .clock-stage {
                left: 50% !important;
                top: 45% !important;
                transform: translate(-50%, -50%) scale(0.52) !important;
            }

            .date-display {
                left: 420px !important;
                top: 62% !important;
                text-align: left !important;
                padding: 0 !important;
            }

            .motivation-comment {
                font-size: 0.6rem !important;
                margin-bottom: 3px !important;
            }

            .date-display .full-date {
                font-size: 0.75rem !important;
                margin-bottom: 2px !important;
            }

            .date-display .day-name {
                font-size: 0.9rem !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Botón flotante para invocar la función de fondo -->
        <button class="wallpaper-btn" id="set-wallpaper-btn">ESTABLECER FONDO</button>

        <div class="clock-stage" id="clock-btn" title="Abrir Reloj">
            <div class="hour-display" id="hour">00</div>

            <div class="oval-pill">
                <span class="pill-minute" id="pill-minute">00</span>
                <span class="pill-second" id="pill-second">00</span>
            </div>

            <div class="wheel-center">
                <div class="dial-ring" id="minutes-ring"></div>
                <div class="dial-ring" id="seconds-ring"></div>
            </div>

            <!-- El bloque de la fecha ahora forma parte interna de la estructura del reloj -->
            <div class="date-display" id="calendar-btn" title="Abrir Calendario">
                <div class="motivation-comment">// RESISTE INÚTIL, TÚ PUEDES</div>
                <div class="full-date" id="date-str">-- --- ----</div>
                <div class="day-name" id="day-str">------</div>
            </div>
        </div>
    </div>

    <script>
        const R_MINUTES_TICKS = 145; 
        const R_MINUTES_NUM   = 180; 
        const R_SECONDS_TICKS = 255; 
        const R_SECONDS_NUM   = 290;

        document.getElementById('set-wallpaper-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            if (window.AndroidBridge && typeof window.AndroidBridge.openWallpaperPicker === 'function') {
                window.AndroidBridge.openWallpaperPicker();
            } else {
                alert("Para usar esta opción como fondo animado, debes abrir la app compilada con Live Wallpaper habilitado.");
            }
        });

        document.getElementById('clock-btn').addEventListener('click', function() {
            window.location.href = "ms-clock:";
        });

        document.getElementById('calendar-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            window.location.href = "outlookcal:";
        });

        function renderArcElements(exactMinute, exactSecond, currentMinInt, currentSecInt) {
            const minutesRing = document.getElementById('minutes-ring');
            const secondsRing = document.getElementById('seconds-ring');

            minutesRing.innerHTML = '';
            secondsRing.innerHTML = '';

            // 1. MINUTOS
            for (let i = 0; i < 60; i++) {
                let diff = i - exactMinute;
                while (diff < -30) diff += 60;
                while (diff > 30) diff -= 60;

                const angleDeg = diff * 6;

                if (angleDeg >= -88 && angleDeg <= 88) {
                    const angleRad = angleDeg * (Math.PI / 180);
                    const isCurrentMin = (i === currentMinInt);
                    const opacity = isCurrentMin ? 1.0 : Math.max(0.12, 1 - Math.pow(Math.abs(angleDeg) / 90, 1.4));

                    const mTick = document.createElement('div');
                    const isMajor = i % 5 === 0;
                    mTick.className = `minute-tick-item ${isMajor ? 'major' : ''} ${isCurrentMin ? 'active' : ''}`;
                    
                    const xMTick = R_MINUTES_TICKS * Math.cos(angleRad);
                    const yMTick = R_MINUTES_TICKS * Math.sin(angleRad);

                    mTick.style.left = `${xMTick}px`;
                    mTick.style.top = `${yMTick}px`;
                    mTick.style.transform = `rotate(${angleDeg + 90}deg)`;
                    mTick.style.opacity = isCurrentMin ? "1" : (opacity * 0.75).toFixed(2);
                    minutesRing.appendChild(mTick);

                    if (i % 5 === 0 && Math.abs(angleDeg) > 12) {
                        const item = document.createElement('div');
                        item.className = 'minute-item';
                        item.innerText = i.toString().padStart(2, '0');

                        const x = R_MINUTES_NUM * Math.cos(angleRad);
                        const y = R_MINUTES_NUM * Math.sin(angleRad);

                        item.style.left = `${x}px`;
                        item.style.top = `${y}px`;
                        item.style.transform = `rotate(${angleDeg}deg)`;
                        item.style.opacity = opacity.toFixed(2);
                        item.style.color = opacity > 0.8 ? '#ffffff' : `rgba(255, 255, 255, ${opacity})`;

                        minutesRing.appendChild(item);
                    }
                }
            }

            // 2. SEGUNDOS
            for (let i = 0; i < 60; i++) {
                let diff = i - exactSecond;
                while (diff < -30) diff += 60;
                while (diff > 30) diff -= 60;

                const angleDeg = diff * 6;

                if (angleDeg >= -88 && angleDeg <= 88) {
                    const angleRad = angleDeg * (Math.PI / 180);
                    const isCurrentSec = (i === currentSecInt);
                    const opacity = isCurrentSec ? 1.0 : Math.max(0.1, 1 - Math.pow(Math.abs(angleDeg) / 90, 1.3));

                    const tick = document.createElement('div');
                    const isMajor = i % 5 === 0;
                    tick.className = `tick-item ${isMajor ? 'major' : ''} ${isCurrentSec ? 'active' : ''}`;

                    const xTick = R_SECONDS_TICKS * Math.cos(angleRad);
                    const yTick = R_SECONDS_TICKS * Math.sin(angleRad);

                    tick.style.left = `${xTick}px`;
                    tick.style.top = `${yTick}px`;
                    tick.style.transform = `rotate(${angleDeg + 90}deg)`;
                    tick.style.opacity = isCurrentSec ? "1" : opacity.toFixed(2);
                    secondsRing.appendChild(tick);

                    if (i % 5 === 0 && Math.abs(angleDeg) > 10) {
                        const secNum = document.createElement('div');
                        secNum.className = 'second-num-item';
                        secNum.innerText = i.toString().padStart(2, '0');

                        const xNum = R_SECONDS_NUM * Math.cos(angleRad);
                        const yNum = R_SECONDS_NUM * Math.sin(angleRad);

                        secNum.style.left = `${xNum}px`;
                        secNum.style.top = `${yNum}px`;
                        secNum.style.transform = `rotate(${angleDeg}deg)`;
                        secNum.style.opacity = opacity.toFixed(2);
                        secNum.style.color = opacity > 0.8 ? '#ffffff' : `rgba(255, 255, 255, ${opacity})`;

                        secondsRing.appendChild(secNum);
                    }
                }
            }
        }

        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            const exactSecond = seconds + (milliseconds / 1000);
            const exactMinute = minutes + (exactSecond / 60);

            document.getElementById('hour').innerText = hours.toString().padStart(2, '0');
            document.getElementById('pill-minute').innerText = minutes.toString().padStart(2, '0');
            document.getElementById('pill-second').innerText = seconds.toString().padStart(2, '0');

            renderArcElements(exactMinute, exactSecond, minutes, seconds);

            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            const days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];

            document.getElementById('date-str').innerText = `${now.getDate().toString().padStart(2, '0')} ${months[now.getMonth()]} ${now.getFullYear()}`;
            document.getElementById('day-str').innerText = days[now.getDay()];

            requestAnimationFrame(updateClock);
        }

        requestAnimationFrame(updateClock);
    </script>
</body>
</html>
