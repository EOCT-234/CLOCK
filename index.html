<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimalist Arc Clock Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #050507;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* --- CAPA 1: IMAGEN GEOMÉTRICA DE FONDO AISLADA EN GPU --- */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("https://raw.githubusercontent.com/EOCT-234/CLOCK/refs/heads/main/images.jpg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            /* Atenúa las franjas plateadas para no competir con los números blancos */
            filter: brightness(0.42) contrast(1.15);
            transform: translateZ(0);
            will-change: transform;
        }

        /* --- CAPA 2: SOMBRA DE CONTRASTE Y MICRO-GRANO ANTI-PIXELADO --- */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background-image: 
                /* Oscurece ligeramente el tercio derecho y la zona de la fecha */
                linear-gradient(
                    90deg,
                    rgba(4, 5, 7, 0.15) 0%,
                    rgba(4, 5, 7, 0.35) 55%,
                    rgba(4, 5, 7, 0.68) 100%
                ),
                linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.15) 0%,
                    transparent 55%,
                    rgba(0, 0, 0, 0.65) 100%
                ),
                /* Grano fino para suavizar la imagen al estirarse en pantallas grandes */
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='0.04' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .widget-wrapper {
            width: 33.33vw;
            min-width: 320px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding-top: 6vh;
            padding-bottom: 8vh;
            margin-left: auto;
        }

        /* --- CONTENEDOR DEL RELOJ --- */
        .clock-stage {
            position: relative;
            width: 100%;
            height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(0.85);
        }

        .hour-display {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 7rem;
            font-weight: 700;
            color: #ffffff;
            z-index: 10;
            line-height: 1;
            letter-spacing: -3px;
            text-shadow: 0 4px 22px rgba(0, 0, 0, 0.95);
        }

        .oval-pill {
            position: absolute;
            left: 170px;
            top: 50%;
            transform: translateY(-50%);
            width: 180px;
            height: 58px;
            border: 1.5px solid rgba(255, 255, 255, 0.92);
            border-radius: 30px;
            /* Fondo oscuro sólido/translúcido ligero para mantener los 60 FPS */
            background: linear-gradient(180deg, rgba(24, 27, 33, 0.85) 0%, rgba(8, 10, 14, 0.94) 100%);
            z-index: 8;
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.85),
                0 0 18px rgba(255, 255, 255, 0.16),
                inset 0 1px 1px rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px 0 38px;
        }

        .oval-pill .pill-minute {
            font-size: 2.8rem;
            font-weight: 700;
            color: #ffffff;
            z-index: 12;
            line-height: 1;
            letter-spacing: -1px;
        }

        .oval-pill .pill-second {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.88);
            z-index: 12;
            letter-spacing: 0px;
        }

        .wheel-center {
            position: absolute;
            left: 60px;
            top: 50%;
            width: 0;
            height: 0;
            z-index: 5;
        }

        .dial-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
        }

        .minute-tick-item {
            position: absolute;
            width: 2px;
            height: 8px;
            background-color: #ffffff;
            margin-left: -1px;
            margin-top: -4px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
        }

        .minute-tick-item.major {
            width: 3px;
            height: 16px;
            margin-left: -1.5px;
            margin-top: -8px;
        }

        .minute-tick-item.active {
            width: 4px !important;
            height: 20px !important;
            background-color: #ffffff !important;
            margin-left: -2px !important;
            margin-top: -10px !important;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.95);
            z-index: 15;
        }

        .minute-item {
            position: absolute;
            font-size: 1.3rem;
            font-weight: 600;
            width: 50px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            margin-left: -25px;
            margin-top: -20px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }

        .tick-item {
            position: absolute;
            width: 2px;
            height: 10px;
            background-color: #ffffff;
            margin-left: -1px;
            margin-top: -5px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
        }

        .tick-item.major {
            width: 3px;
            height: 16px;
            margin-left: -1.5px;
            margin-top: -8px;
        }

        .tick-item.active {
            width: 3px !important;
            height: 18px !important;
            background-color: #ffffff !important;
            margin-left: -1.5px !important;
            margin-top: -9px !important;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
            z-index: 15;
        }

        .second-num-item {
            position: absolute;
            font-size: 1rem;
            font-weight: 600;
            width: 40px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            margin-left: -20px;
            margin-top: -15px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }

        /* --- BLOQUE DE FECHA --- */
        .date-display {
            position: relative;
            text-align: center;
            font-family: monospace;
            letter-spacing: 1.5px;
            z-index: 20;
            padding: 12px 24px;
        }

        .motivation-comment {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.62);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }

        .date-display .full-date {
            font-size: 1.15rem;
            color: rgba(255, 255, 255, 0.92);
            font-weight: 700;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
        }

        .date-display .day-name {
            font-size: 1.55rem;
            color: #ffffff;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.98);
        }

        /* --- ADAPTACIÓN MÓVIL --- */
        @media screen and (max-width: 900px), screen and (orientation: portrait) {
            body::after {
                background-image: 
                    radial-gradient(circle at 50% 42%, rgba(4, 5, 7, 0.35) 0%, rgba(4, 5, 7, 0.72) 100%),
                    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='0.04' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            }

            .container {
                justify-content: center !important;
            }

            .widget-wrapper {
                width: 100vw !important;
                margin-left: 0 !important;
                padding-top: 8vh !important;
                padding-bottom: 6vh !important;
            }

            .clock-stage {
                transform: scale(0.72) !important;
            }

            .motivation-comment {
                font-size: 0.75rem !important;
            }

            .date-display .full-date {
                font-size: 1.05rem !important;
            }

            .date-display .day-name {
                font-size: 1.35rem !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="widget-wrapper">
            <div class="clock-stage">
                <div class="hour-display" id="hour">00</div>

                <div class="oval-pill">
                    <span class="pill-minute" id="pill-minute">00</span>
                    <span class="pill-second" id="pill-second">00</span>
                </div>

                <div class="wheel-center">
                    <div class="dial-ring" id="minutes-ring"></div>
                    <div class="dial-ring" id="seconds-ring"></div>
                </div>
            </div>

            <div class="date-display">
                <div class="motivation-comment">// RESISTE INÚTIL, TÚ PUEDES</div>
                <div class="full-date" id="date-str">-- --- ----</div>
                <div class="day-name" id="day-str">------</div>
            </div>
        </div>
    </div>

    <script>
        const R_MINUTES_TICKS = 145; 
        const R_MINUTES_NUM   = 180; 
        const R_SECONDS_TICKS = 255; 
        const R_SECONDS_NUM   = 290;

        function renderArcElements(exactMinute, exactSecond, currentMinInt, currentSecInt) {
            const minutesRing = document.getElementById('minutes-ring');
            const secondsRing = document.getElementById('seconds-ring');

            minutesRing.innerHTML = '';
            secondsRing.innerHTML = '';

            // 1. MINUTOS
            for (let i = 0; i < 60; i++) {
                let diff = i - exactMinute;
                while (diff < -30) diff += 60;
                while (diff > 30) diff -= 60;

                const angleDeg = diff * 6;

                if (angleDeg >= -88 && angleDeg <= 88) {
                    const angleRad = angleDeg * (Math.PI / 180);
                    const isCurrentMin = (i === currentMinInt);
                    const opacity = isCurrentMin ? 1.0 : Math.max(0.15, 1 - Math.pow(Math.abs(angleDeg) / 90, 1.4));

                    const mTick = document.createElement('div');
                    const isMajor = i % 5 === 0;
                    mTick.className = `minute-tick-item ${isMajor ? 'major' : ''} ${isCurrentMin ? 'active' : ''}`;
                    
                    const xMTick = R_MINUTES_TICKS * Math.cos(angleRad);
                    const yMTick = R_MINUTES_TICKS * Math.sin(angleRad);

                    mTick.style.left = `${xMTick}px`;
                    mTick.style.top = `${yMTick}px`;
                    mTick.style.transform = `rotate(${angleDeg + 90}deg)`;
                    mTick.style.opacity = isCurrentMin ? "1" : (opacity * 0.85).toFixed(2);
                    minutesRing.appendChild(mTick);

                    if (i % 5 === 0 && Math.abs(angleDeg) > 12) {
                        const item = document.createElement('div');
                        item.className = 'minute-item';
                        item.innerText = i.toString().padStart(2, '0');

                        const x = R_MINUTES_NUM * Math.cos(angleRad);
                        const y = R_MINUTES_NUM * Math.sin(angleRad);

                        item.style.left = `${x}px`;
                        item.style.top = `${y}px`;
                        item.style.transform = `rotate(${angleDeg}deg)`;
                        item.style.opacity = opacity.toFixed(2);
                        item.style.color = opacity > 0.8 ? '#ffffff' : `rgba(255, 255, 255, ${opacity})`;

                        minutesRing.appendChild(item);
                    }
                }
            }

            // 2. SEGUNDOS
            for (let i = 0; i < 60; i++) {
                let diff = i - exactSecond;
                while (diff < -30) diff += 60;
                while (diff > 30) diff -= 60;

                const angleDeg = diff * 6;

                if (angleDeg >= -88 && angleDeg <= 88) {
                    const angleRad = angleDeg * (Math.PI / 180);
                    const isCurrentSec = (i === currentSecInt);
                    const opacity = isCurrentSec ? 1.0 : Math.max(0.15, 1 - Math.pow(Math.abs(angleDeg) / 90, 1.3));

                    const tick = document.createElement('div');
                    const isMajor = i % 5 === 0;
                    tick.className = `tick-item ${isMajor ? 'major' : ''} ${isCurrentSec ? 'active' : ''}`;

                    const xTick = R_SECONDS_TICKS * Math.cos(angleRad);
                    const yTick = R_SECONDS_TICKS * Math.sin(angleRad);

                    tick.style.left = `${xTick}px`;
                    tick.style.top = `${yTick}px`;
                    tick.style.transform = `rotate(${angleDeg + 90}deg)`;
                    tick.style.opacity = isCurrentSec ? "1" : opacity.toFixed(2);
                    secondsRing.appendChild(tick);

                    if (i % 5 === 0 && Math.abs(angleDeg) > 10) {
                        const secNum = document.createElement('div');
                        secNum.className = 'second-num-item';
                        secNum.innerText = i.toString().padStart(2, '0');

                        const xNum = R_SECONDS_NUM * Math.cos(angleRad);
                        const yNum = R_SECONDS_NUM * Math.sin(angleRad);

                        secNum.style.left = `${xNum}px`;
                        secNum.style.top = `${yNum}px`;
                        secNum.style.transform = `rotate(${angleDeg}deg)`;
                        secNum.style.opacity = opacity.toFixed(2);
                        secNum.style.color = opacity > 0.8 ? '#ffffff' : `rgba(255, 255, 255, ${opacity})`;

                        secondsRing.appendChild(secNum);
                    }
                }
            }
        }

        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            const exactSecond = seconds + (milliseconds / 1000);
            const exactMinute = minutes + (exactSecond / 60);

            document.getElementById('hour').innerText = hours.toString().padStart(2, '0');
            document.getElementById('pill-minute').innerText = minutes.toString().padStart(2, '0');
            document.getElementById('pill-second').innerText = seconds.toString().padStart(2, '0');

            renderArcElements(exactMinute, exactSecond, minutes, seconds);

            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            const days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];

            document.getElementById('date-str').innerText = `${now.getDate().toString().padStart(2, '0')} ${months[now.getMonth()]} ${now.getFullYear()}`;
            document.getElementById('day-str').innerText = days[now.getDay()];

            requestAnimationFrame(updateClock);
        }

        requestAnimationFrame(updateClock);
    </script>
</body>
</html>
