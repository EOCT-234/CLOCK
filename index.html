<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Arc Clock Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
        }

        /* Área general del reloj */
        .clock-container {
            position: absolute;
            left: -150px;
            top: 50%;
            transform: translateY(-50%);
            width: 700px;
            height: 700px;
        }

        /* Hora principal fija */
        .hour-display {
            position: absolute;
            left: 200px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 8rem;
            font-weight: 700;
            color: #ffffff;
            z-index: 10;
            line-height: 1;
        }

        /* Píldora selector donde encajan los minutos */
        .pill-indicator {
            position: absolute;
            left: 350px;
            top: 50%;
            transform: translateY(-50%);
            width: 120px;
            height: 60px;
            border: 2px solid #ffffff;
            border-radius: 30px;
            z-index: 5;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }

        /* Diales de rotación */
        .dial {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 0.5s cubic-bezier(0.2, 0, 0, 1);
        }

        /* Anillo Exterior: Ticks de Segundos */
        .tick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            transform-origin: 0 0;
        }

        .tick.major {
            width: 3px;
            height: 16px;
            background-color: rgba(255, 255, 255, 0.8);
        }

        /* Anillo Interior: Números de Minutos */
        .minute-num {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 1.6rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            transform-origin: center center;
        }

        /* Bloque de Fecha y Día */
        .date-display {
            position: absolute;
            right: 80px;
            bottom: 80px;
            text-align: right;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .date-display .full-date {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .date-display .day-name {
            font-size: 1.5rem;
            color: #ffffff;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* Botones de Control */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            opacity: 0.3;
            transition: opacity 0.3s ease;
            z-index: 20;
        }

        .controls:hover {
            opacity: 1;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Botones de Control -->
        <div class="controls">
            <button class="btn" onclick="toggleFormat()">Formato: <span id="format-label">24H</span></button>
            <button class="btn" onclick="toggleFullscreen()">Pantalla Completa</button>
        </div>

        <div class="clock-container">
            <!-- Hora -->
            <div class="hour-display" id="hour">12</div>

            <!-- Píldora que encierra el minuto actual -->
            <div class="pill-indicator"></div>

            <!-- Diales giratorios de segundos y minutos -->
            <div class="dial" id="ticks-dial"></div>
            <div class="dial" id="minutes-dial"></div>
        </div>

        <!-- Fecha inferior derecha -->
        <div class="date-display">
            <div class="full-date" id="date-str">08 NOV 2026</div>
            <div class="day-name" id="day-str">SUNDAY</div>
        </div>
    </div>

    <script>
        let is24Hour = true;

        function createClockDials() {
            const ticksDial = document.getElementById('ticks-dial');
            const minutesDial = document.getElementById('minutes-dial');

            const center = 350;
            const outerRadius = 300; // Radio del círculo de marcas/segundos
            const innerRadius = 240; // Radio del círculo interior con los números de minutos

            // 1. Crear marcas de segundos (Anillo Exterior)
            for (let i = 0; i < 60; i++) {
                const angle = (i * 6) * (Math.PI / 180);
                const tick = document.createElement('div');
                tick.className = `tick ${i % 5 === 0 ? 'major' : ''}`;

                const x = center + outerRadius * Math.cos(angle);
                const y = center + outerRadius * Math.sin(angle);

                tick.style.left = `${x}px`;
                tick.style.top = `${y}px`;
                tick.style.transform = `rotate(${i * 6 + 90}deg)`;
                ticksDial.appendChild(tick);
            }

            // 2. Crear números de minutos (Anillo Interior)
            for (let i = 0; i < 60; i += 5) {
                const angle = (i * 6) * (Math.PI / 180);
                const num = document.createElement('div');
                num.className = 'minute-num';
                num.innerText = i.toString().padStart(2, '0');

                const x = center + innerRadius * Math.cos(angle) - 20;
                const y = center + innerRadius * Math.sin(angle) - 20;

                num.style.left = `${x}px`;
                num.style.top = `${y}px`;
                num.style.transform = `rotate(${i * 6}deg)`;
                minutesDial.appendChild(num);
            }
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            if (!is24Hour) {
                hours = hours % 12 || 12;
            }

            // Hora
            document.getElementById('hour').innerText = hours.toString().padStart(2, '0');

            // Rotación alineada a las 0° (la píldora a la derecha)
            const minuteAngle = -(minutes * 6 + (seconds / 60) * 6);
            document.getElementById('minutes-dial').style.transform = `rotate(${minuteAngle}deg)`;
            document.getElementById('ticks-dial').style.transform = `rotate(${minuteAngle}deg)`;

            // Fecha
            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            const days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];

            document.getElementById('date-str').innerText = `${now.getDate().toString().padStart(2, '0')} ${months[now.getMonth()]} ${now.getFullYear()}`;
            document.getElementById('day-str').innerText = days[now.getDay()];
        }

        function toggleFormat() {
            is24Hour = !is24Hour;
            document.getElementById('format-label').innerText = is24Hour ? '24H' : '12H';
            updateClock();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        createClockDials();
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
